<!doctype html>
<html lang="en" data-quality="high">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Home</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/themes.css">
<link rel="stylesheet" href="/app.css">
<script src="/js/vendor/liquid-glass.js" defer></script>
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div class="ground" aria-hidden="true"></div>

<main class="pager" id="pager" aria-label="Pages"></main>

<div class="corner" id="corner" aria-hidden="true">
  <span class="corner-time"></span>
  <span class="corner-date"></span>
</div>

<button class="gear" id="gear" type="button" aria-label="Settings"></button>

<nav class="dots glass" id="dots" aria-label="Pages"></nav>

<div class="reconnect glass" id="link" role="status" hidden><i class="light busy"></i><span>Reconnecting</span></div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="settings" id="settings" aria-label="Settings"></dialog>
</body>
</html>
