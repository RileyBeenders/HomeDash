<!doctype html>
<html lang="en" data-quality="high">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Home</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div class="ground" aria-hidden="true"></div>

<main class="pager" id="pager" aria-label="Pages"></main>

<div class="corner" id="corner" aria-hidden="true">
  <span class="corner-time"></span>
  <span class="corner-date"></span>
</div>

<button class="gear" id="gear" type="button" aria-label="Settings">
  <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
</button>

<nav class="dots glass" id="dots" aria-label="Pages"></nav>

<div class="reconnect glass" id="link" role="status" hidden><i class="light busy"></i><span>Reconnecting</span></div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="settings" id="settings" aria-label="Settings"></dialog>
</body>
</html>
